name: CI & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  lint_and_test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config protobuf-compiler cmake libssl-dev
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite pkg-config protobuf cmake openssl
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy -- -D warnings
      - name: Run tests
        run: cargo test

  build_and_package:
    name: Build & Package
    needs: lint_and_test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: signal-cli-linux-x86_64
            archive_suffix: Linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: signal-cli-macos-x86_64
            archive_suffix: macOS-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: signal-cli-linux-aarch64
            archive_suffix: Linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config protobuf-compiler cmake libssl-dev
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite pkg-config protobuf cmake openssl
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      
      - name: Package Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          ARCHIVE_NAME="signal-cli-${VERSION}-${{ matrix.archive_suffix }}.tar.gz"
          mkdir -p dist
          cp target/release/signal-cli dist/
          cp README.md LICENSE dist/
          cp -r docs dist/
          tar -czvf ${ARCHIVE_NAME} -C dist .
          echo "archive_path=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
        id: package

      - name: Upload Package Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: signal-cli-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build_and_package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download all archives
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts/
          pattern: signal-cli-*-x86_64
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.tar.gz
          body_path: CHANGELOG.md
          generate_release_notes: true
          draft: false
          prerelease: false
