[package]
name = "signal-cli"
version = "0.1.3-dev"
edition = "2024"
description = "A Rust implementation of signal-cli, a command-line interface for Signal."
license = "AGPL-3.0-only"
keywords = ["signal", "messenger", "cli", "presage"]
categories = ["command-line-utilities", "communication"]

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", default-features = false }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "io-std", "time", "fs"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
mime_guess = "2.0"
url = "2.5"
# futures::channel::oneshot is required by presage link APIs (LocalSet);
# tokio::sync::oneshot is used for the Send RPC actor in rpc/server.rs.
futures = "0.3"
base64 = "0.22"
uuid = { version = "1.7", features = ["v4", "serde"] }
# Bundled SQLite so presage-store-sqlite builds without a system libsqlite3.
libsqlite3-sys = { version = "0.36.0", features = ["bundled"] }
axum = { version = "0.8.9", features = ["macros"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
tempfile = "3.9"
