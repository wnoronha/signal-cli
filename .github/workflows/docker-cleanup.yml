name: Container retention

# GHCR never prunes old images on its own. Weekly, drop ephemeral
# per-commit (sha-*) and untagged versions; tagged releases are kept.
# Public packages are free, this just bounds clutter/storage growth.

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Prune old ephemeral image versions
        uses: snok/container-retention-policy@v3
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: signal-cli
          cut-off: 7 days ago UTC
          keep-at-least: 10
          filter-tags: "sha-*"
          filter-include-untagged: true
          dry-run: false
